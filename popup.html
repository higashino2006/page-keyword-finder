<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 13px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    #status.info {
      background-color: #e3f2fd;
      color: #1976d2;
      display: block;
    }
    #status.success {
      background-color: #e8f5e9;
      color: #388e3c;
      display: block;
    }
    #status.error {
      background-color: #ffebee;
      color: #c62828;
      display: block;
    }
    .note {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
    }
    .mode-selector {
      margin-bottom: 15px;
    }
    .mode-selector label {
      display: inline-flex;
      align-items: center;
      margin-right: 15px;
      font-weight: normal;
      cursor: pointer;
    }
    .mode-selector input[type="radio"] {
      margin-right: 5px;
    }
    .mode-options {
      margin-top: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <h3>ページ検索</h3>

  <div class="input-group">
    <label for="keyword">検索キーワード:</label>
    <input type="text" id="keyword" placeholder="例: 探している文字列">
  </div>

  <div class="input-group">
    <label>検索モード:</label>
    <div class="mode-selector">
      <label>
        <input type="radio" name="searchMode" value="page" checked>
        ページ遷移
      </label>
      <label>
        <input type="radio" name="searchMode" value="scroll">
        スクロール
      </label>
    </div>
  </div>

  <div id="pageOptions" class="mode-options">
    <div class="input-group" style="margin-bottom: 0;">
      <label for="maxPages">最大ページ数:</label>
      <input type="number" id="maxPages" value="50" min="1" max="1000">
      <div class="note">現在のページから何ページ先まで検索するか</div>
    </div>
  </div>

  <div id="scrollOptions" class="mode-options hidden">
    <div class="input-group" style="margin-bottom: 0;">
      <label for="maxScrollTop">最大スクロール位置 (px):</label>
      <input type="number" id="maxScrollTop" value="50000" min="100" max="1000000">
      <div class="note">ここまでスクロールしてキーワードを探す</div>
    </div>
  </div>
  
  <button id="startSearch">検索開始</button>
  <button id="stopSearch" style="background-color: #f44336; display: none;">検索停止</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
